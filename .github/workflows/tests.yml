name: Example checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt -r requirements-test.txt -r requirements-docs.txt
      - run: python -m pip check
      - run: python run.py --check
      - run: python examples/index_grip.py --output /tmp/index-grip.abdesign.json
      - run: python run.py --check-offline
      - run: python -m pytest -q
      - run: python tools/check_project.py
      - run: python tools/render_docs.py
      - run: git diff --exit-code -- docs/site
